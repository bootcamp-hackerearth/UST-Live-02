<aside class="sidebar">
  <nav class="menu-container">
    <ul class="menu-list">
      @for (menu of menus; track menu.path) {
        @if (menu.isActive !== false) {
          <li class="menu-item">
            <a [routerLink]="menu.path" routerLinkActive="active-link" class="menu-link">
              <i class="bi bi-{{ menu.icon || 'circle' }} menu-icon"></i>
              <span class="menu-text">{{ menu.name }}</span>

              @if (
                menu.path.toLowerCase().includes('appointment') && pendingAppointmentsCount > 0
              ) {
                <span *hasPermission="'VIEW_PENDING_APPOINTMENTS_COUNT'" class="badge-pulse">{{
                  pendingAppointmentsCount
                }}</span>
              }
            </a>
          </li>
        }
      }
    </ul>
  </nav>
</aside>
