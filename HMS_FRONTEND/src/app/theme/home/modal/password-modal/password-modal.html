<div class="modal-overlay">
  <div class="modal-content">
    <button routerLink="/login" type="button" class="modal-close" title="Close">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="modal-header">
      <div class="modal-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <span class="modal-subtitle">Security</span>
      <h2>Set New Password</h2>
      <p class="modal-description">Choose a strong password with at least 8 characters.</p>
    </div>
    <form [formGroup]="passwordForm">
      <div class="modal-form">
        <div class="form-group">
          <label class="form-label" for="newPassword">
            <i class="bi bi-key"></i>
            New Password
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="newPassword"
              class="form-input"
              placeholder="Enter new password"
              formControlName="password"
            />
            <span class="input-icon">
              <i class="bi bi-eye"></i>
            </span>
          </div>
          <span
            class="error-text"
            *ngIf="
              passwordForm.get('password')?.errors?.['required'] &&
              passwordForm.get('password')?.touched
            "
          >
            Password is required
          </span>
          <span
            class="error-text"
            *ngIf="
              passwordForm.get('password')?.errors?.['minlength'] &&
              passwordForm.get('password')?.touched
            "
          >
            Min 8 characters is required
          </span>
          <span
          class="error-text"
            *ngIf="
              passwordForm.get('password')?.errors?.['pattern'] &&
              passwordForm.get('password')?.touched
            "
            >Atleast one digit and one uppercase letter is required.</span
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">
            <i class="bi bi-shield-check"></i>
            Confirm Password
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="Re-enter new password"
              formControlName="confirmPassword"
            />
            <span class="input-icon">
              <i class="bi bi-eye"></i>
            </span>
          </div>
          <span
            class="error-text"
            *ngIf="
              passwordForm.errors?.['passwordMismatch'] &&
              passwordForm.get('confirmPassword')?.touched
            "
          >
            Passwords doesn't match
          </span>
        </div>
        <div class="info-box">
          <i class="bi bi-info-circle"></i>
          You need to set a new password before proceeding
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost"><i class="bi bi-x-lg"></i> Cancel</button>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="passwordForm.invalid"
            [class.disabled]="passwordForm.invalid"
            (click)="onSubmit()"
          >
            <i class="bi bi-check2-circle"></i> Update Password
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
