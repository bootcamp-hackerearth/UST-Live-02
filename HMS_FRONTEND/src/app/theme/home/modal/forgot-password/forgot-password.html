<div class="backdrop">
  <div class="forgot-box">
    <div class="header">
      <h2>Forgot Password?</h2>
      <p>Enter your email address below and we'll send you a link to reset your password.</p>
    </div>

    <form class="forgot-form">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="johndoe@gmail.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          #emailModel="ngModel"
          required
          email
        />
        <span class="error" *ngIf="emailModel.touched" class="error-text">
          <p *ngIf="emailModel.errors?.['email']">Incorrect email format.</p>
          <p *ngIf="emailModel.errors?.['required']">Email is required.</p>
        </span>
      </div>

      <button
        type="submit"
        class="submit-btn"
        (click)="onSubmit()"
        [disabled]="emailModel.invalid || isLoading()"
      >
        {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="footer">
      <a href="#" class="back-to-login" (click)="backToLogin()">Back to Login</a>
    </div>
  </div>
</div>
