<aside class="sidebar">
  <div class="sidebar-section-label">
    <span>Menu</span>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let node of nodeData()" routerLinkActive="active">
        <a [routerLink]="node.path">
          <span class="nav-indicator"></span>
          <span class="nav-icon">
            <i class="{{ node.icon }}"></i>
          </span>
          <span class="nav-label">{{ node.name }}</span>
          <i class="bi bi-chevron-right nav-chevron"></i>
        </a>
      </li>
    </ul>
  </nav>
</aside>
