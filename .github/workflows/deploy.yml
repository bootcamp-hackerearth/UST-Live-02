name: Deploy HMS to EC2

on:
  push:
    branches:
      - feature/sprint4_pod1_varshith

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install and verify backend
      - name: Install Backend Dependencies
        run: |
          cd HMS_Back_end
          npm install --ignore-scripts

      # Step 4: Install and build Angular
      - name: Install Angular Dependencies
        run: |
          cd HMS_Front_end
          npm install

      - name: Build Angular
        run: |
          cd HMS_Front_end
          npx ng build --configuration production

      # Step 5: Ensure swap exists on EC2 for future builds
      - name: Setup EC2 Swap Memory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap created"
            else
              echo "Swap already exists"
            fi

      # Step 6: Deploy backend to EC2
      - name: Deploy Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/UST-Live-02
            git pull origin feature/sprint4_pod1_varshith

            cd HMS-BACKEND
            npm install --ignore-scripts

            # Create .env from GitHub Secrets
            cat > .env << 'ENVEOF'
            PORT=5000
            NODE_ENV=production
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_PATIENT_SECRET=${{ secrets.JWT_PATIENT_SECRET }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN }}
            REFRESH_TOKEN_EXPIRES_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRES_DAYS }}
            OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}
            OWNER_PASS=${{ secrets.OWNER_PASS }}
            NODE_TLS_REJECT_UNAUTHORIZED=${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}
            FRONTEND_URL=http://${{ secrets.EC2_HOST }}
            ENVEOF

            pm2 restart hms-backend || pm2 start src/server.js --name hms-backend
            pm2 save

            echo "Backend deployed"

      # Step 7: Copy Angular build files to EC2
      - name: Copy Angular Build to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "HMS_Front_end/dist/Admin-Panel/browser/*"
          target: "/tmp/angular-build"
          strip_components: 4

      # Step 8: Move files and restart Nginx
      - name: Deploy Angular and Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clear old files
            sudo rm -rf /var/www/html/*

            # Copy new build
            sudo cp -r /tmp/angular-build/* /var/www/html/

            # Set permissions
            sudo chown -R www-data:www-data /var/www/html/
            sudo chmod -R 755 /var/www/html/

            # Clean temp
            rm -rf /tmp/angular-build

            # Restart Nginx
            sudo systemctl restart nginx

            echo "Angular deployed"

      # Step 9: Health check
      - name: Health Check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== PM2 Status ==="
            pm2 list

            echo "=== API Health Check ==="
            curl -s http://localhost:5000/ || echo "Backend not responding"

            echo "=== Nginx Status ==="
            sudo systemctl status nginx --no-pager -l | head -5

            echo "=== Angular Files ==="
            ls /var/www/html/index.html && echo "index.html exists" || echo "index.html missing"

            echo "=== DEPLOYMENT COMPLETE ==="
