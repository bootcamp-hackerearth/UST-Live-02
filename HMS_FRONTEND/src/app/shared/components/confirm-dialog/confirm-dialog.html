@if(dialog(); as dialog) {
<div class="confirm-backdrop" (click)="cancel()" (keydown.escape)="cancel()">
  <section class="confirm-card" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="confirm-icon" [ngClass]="dialog.tone">{{ dialog.tone === 'danger' ? '!' : '?' }}</div>

    <div>
      <h2>{{ dialog.title }}</h2>
      <p>{{ dialog.message }}</p>
    </div>

    <div class="confirm-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">{{ dialog.cancelText }}</button>
      <button type="button" class="confirm-btn" [ngClass]="dialog.tone" (click)="confirm()">
        {{ dialog.confirmText }}
      </button>
    </div>
  </section>
</div>
}
