<div class="edit-patient-container">
  <h1>Edit Patient</h1>

  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
    <!-- Patient Information -->

    <div class="section">
      <h2>Patient Information</h2>

      <div class="grid">
        <!-- First Name -->

        <div class="form-group">
          <label for="ep-firstName">First Name</label>

          <input id="ep-firstName" type="text" placeholder="Enter first name" formControlName="firstName" />
        </div>

        <!-- Last Name -->

        <div class="form-group">
          <label for="ep-lastName">Last Name</label>

          <input id="ep-lastName" type="text" placeholder="Enter last name" formControlName="lastName" />
        </div>

        <!-- Gender -->

        <div class="form-group">
          <label for="ep-gender">Gender</label>

          <select id="ep-gender" formControlName="gender">
            <option value="">Select Gender</option>

            <option value="MALE">Male</option>

            <option value="FEMALE">Female</option>

            <option value="OTHER">Other</option>
          </select>
        </div>

        <!-- Blood Group -->

        <div class="form-group">
          <label for="ep-bloodGroup">Blood Group</label>

          <select id="ep-bloodGroup" formControlName="bloodGroup">
            <option value="">Select Blood Group</option>

            <option value="A+">A+</option>

            <option value="A-">A-</option>

            <option value="B+">B+</option>

            <option value="B-">B-</option>

            <option value="AB+">AB+</option>

            <option value="AB-">AB-</option>

            <option value="O+">O+</option>

            <option value="O-">O-</option>
          </select>
        </div>

        <!-- Phone -->

        <div class="form-group">
          <label for="ep-phone">Phone Number</label>

          <input id="ep-phone" type="text" placeholder="Enter phone number" formControlName="phone" />
        </div>

        <!-- Email -->

        <div class="form-group">
          <label for="ep-email">Email Address</label>

          <input id="ep-email" type="email" placeholder="Enter email" formControlName="email" />
        </div>

        <!-- Assigned Doctor -->

        <div class="form-group">
          <label for="ep-assignedDoctor">Assigned Doctor</label>

          <select id="ep-assignedDoctor" formControlName="assignedDoctor">
            <option value="">Select Doctor</option>

            @for ( doctor of doctors(); track doctor._id ) {
            <option [value]="doctor._id">{{ doctor.name }} - {{ doctor.department }}</option>
            }
          </select>
        </div>

        <!-- Patient Type -->

        <div class="form-group">
          <label for="ep-patientType">Patient Type</label>

          <select id="ep-patientType" formControlName="patientType">
            <option value="OPD">OPD</option>

            <option value="IPD">IPD</option>

            <option value="EMERGENCY">Emergency</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Medical Information -->

    <div class="section">
      <h2>Medical Information</h2>

      <div class="grid">
        <!-- Medical History -->

        <div class="form-group">
          <label for="ep-medicalHistory">Medical History</label>

          <textarea id="ep-medicalHistory" placeholder="Enter medical history" formControlName="medicalHistory"></textarea>
        </div>

        <!-- Allergies -->

        <div class="form-group">
          <label for="ep-allergies">Allergies</label>

          <textarea id="ep-allergies" placeholder="Enter allergies" formControlName="allergies"></textarea>
        </div>

        <!-- Insurance Provider -->

        <div class="form-group">
          <label for="ep-insuranceProvider">Insurance Provider</label>

          <input id="ep-insuranceProvider" type="text" placeholder="Enter insurance provider" formControlName="insuranceProvider" />
        </div>
      </div>
    </div>

    <!-- Submit -->

    <button type="submit" [disabled]="isSubmitting()">@if(isSubmitting()){ Updating... } @else { Update Patient }</button>
  </form>
</div>
