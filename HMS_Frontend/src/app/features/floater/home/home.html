<div class="home-page">
  <!-- Background -->

  <div class="bg-gradient"></div>

  <div class="bg-circle circle-1"></div>

  <div class="bg-circle circle-2"></div>

  <!-- Navbar -->

  <nav class="navbar">
    <div class="logo-section">
      <div class="logo-icon">+</div>

      <h2>BootStrap HMS</h2>
    </div>
  </nav>

  <!-- Hero Section -->

  <section class="hero-section">
    <div class="hero-content">
      <p class="hero-label">SMART HEALTHCARE PLATFORM</p>

      <h1>Hospital Management System</h1>

      <p class="hero-description">
        Simplified hospital operations, patient management and healthcare workflows in one modern platform.
      </p>

      <!-- Actions -->

      <div class="hero-actions">
        <button type="button" class="primary-btn" (click)="goToLogin()">Enter System</button>
      </div>

      <!-- Spacebar -->

      <div class="spacebar-box">
        <span>PRESS</span>

        <kbd>SPACEBAR</kbd>

        <span>TO CONTINUE</span>
      </div>
    </div>

    <!-- Right Side -->

    <div class="hero-visual">
      <div class="glass-panel">
        <div class="panel-header">
          <div class="panel-dot"></div>

          <div class="panel-dot"></div>

          <div class="panel-dot"></div>
        </div>

        <div class="panel-content">
          <div class="line large"></div>

          <div class="line medium"></div>

          <div class="line small"></div>

          <div class="cards">
            <div class="mini-card"></div>

            <div class="mini-card"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
