name: Deploy HMS to EC2

on:
  push:
    branches:
      - feature/sprint5/bonny
    paths:
      - "HMS-BACKEND/**"
      - "HMS-FRONTEND/**"
      - ".github/workflows/deploy-ec2.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy HMS to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BONNY_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.BONNY_EC2_SSH_KEY }}
          script_stop: true
          script: |

            set -e


            cd /home/ubuntu/HMS/POD-2-HMS
            git fetch origin
            git checkout feature/sprint5/bonny
            git pull origin feature/sprint5/bonny

            echo "Deploying backend..."
            cd /home/ubuntu/HMS/POD-2-HMS/HMS-BACKEND
            npm install
            pm2 restart hms-backend
            pm2 save

            echo "Deploying frontend..."
            cd /home/ubuntu/HMS/POD-2-HMS/HMS-FRONTEND
            npm install
            npx ng build --configuration ec2

            sudo rm -rf /var/www/hms-frontend/*
            sudo cp -r dist/HMS-FRONTEND/browser/* /var/www/hms-frontend/

            sudo nginx -t
            sudo systemctl reload nginx