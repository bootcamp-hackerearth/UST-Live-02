<section class="denied-wrapper">
  <div class="denied-floating-orb orb-1"></div>
  <div class="denied-floating-orb orb-2"></div>
  <div class="denied-floating-orb orb-3"></div>

  <div class="denied-card">
    <div class="denied-icon-ring">
      <div class="denied-icon-core">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          <line x1="12" y1="16" x2="12" y2="19"></line>
        </svg>
      </div>
    </div>

    <div class="denied-badge">
      <span class="denied-badge-dot"></span>
      ERROR 403
    </div>

    <h1 class="denied-title">Access Denied</h1>

    <p class="denied-description">
      You don't have the required permissions to view this resource. Please contact your system
      administrator if you believe this is an error.
    </p>

    <div class="denied-divider">
      <span class="denied-divider-line"></span>
      <span class="denied-divider-text">What you can do</span>
      <span class="denied-divider-line"></span>
    </div>

    <div class="denied-actions">
      <a routerLink="/profile">
        <button class="denied-btn-primary">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Back to Home
        </button>
      </a>
      <a routerLink="/login">
        <button class="denied-btn-secondary">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In
        </button>
      </a>
    </div>
  </div>
</section>
