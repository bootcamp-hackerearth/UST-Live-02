<div class="edit-patient-container">
  <h1>Edit Patient</h1>

  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
    <!-- Patient Information -->

    <div class="section">
      <h2>Patient Information</h2>

      <div class="grid">
        <!-- First Name -->

        <div class="form-group">
          <label for="edit-patient-first-name">First Name</label>

          <input id="edit-patient-first-name" type="text" placeholder="Enter first name" formControlName="firstName" />
        </div>

        <!-- Last Name -->

        <div class="form-group">
          <label for="edit-patient-last-name">Last Name</label>

          <input id="edit-patient-last-name" type="text" placeholder="Enter last name" formControlName="lastName" />
        </div>

        <!-- Gender -->

        <div class="form-group">
          <label for="edit-patient-gender">Gender</label>

          <select id="edit-patient-gender" formControlName="gender">
            <option value="">Select Gender</option>

            <option value="MALE">Male</option>

            <option value="FEMALE">Female</option>

            <option value="OTHER">Other</option>
          </select>
        </div>

        <!-- Blood Group -->

        <div class="form-group">
          <label for="edit-patient-blood-group">Blood Group</label>

          <select id="edit-patient-blood-group" formControlName="bloodGroup">
            <option value="">Select Blood Group</option>

            <option value="A+">A+</option>

            <option value="A-">A-</option>

            <option value="B+">B+</option>

            <option value="B-">B-</option>

            <option value="AB+">AB+</option>

            <option value="AB-">AB-</option>

            <option value="O+">O+</option>

            <option value="O-">O-</option>
          </select>
        </div>

        <!-- Phone -->

        <div class="form-group">
          <label for="edit-patient-phone">Phone Number</label>

          <input id="edit-patient-phone" type="text" placeholder="Enter phone number" formControlName="phone" />
        </div>

        <!-- Email -->

        <div class="form-group">
          <label for="edit-patient-email">Email Address</label>

          <input id="edit-patient-email" type="email" placeholder="Enter email" formControlName="email" />
        </div>

        <!-- Assigned Doctor -->

        <div class="form-group">
          <label for="edit-patient-assigned-doctor">Assigned Doctor</label>

          <select id="edit-patient-assigned-doctor" formControlName="assignedDoctor">
            <option value="">Select Doctor</option>

            @for ( doctor of doctors; track doctor._id ) {
            <option [value]="doctor._id">{{ doctor.name }} - {{ doctor.department }}</option>
            }
          </select>
        </div>

        <!-- Patient Type -->

        <div class="form-group">
          <label for="edit-patient-type">Patient Type</label>

          <select id="edit-patient-type" formControlName="patientType">
            <option value="OPD">OPD</option>

            <option value="IPD">IPD</option>

            <option value="EMERGENCY">Emergency</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Medical Information -->

    <div class="section">
      <h2>Medical Information</h2>

      <div class="grid">
        <!-- Medical History -->

        <div class="form-group">
          <label for="edit-patient-medical-history">Medical History</label>

          <textarea id="edit-patient-medical-history" placeholder="Enter medical history" formControlName="medicalHistory"></textarea>
        </div>

        <!-- Allergies -->

        <div class="form-group">
          <label for="edit-patient-allergies">Allergies</label>

          <textarea id="edit-patient-allergies" placeholder="Enter allergies" formControlName="allergies"></textarea>
        </div>

        <!-- Insurance Provider -->

        <div class="form-group">
          <label for="edit-patient-insurance-provider">Insurance Provider</label>

          <input id="edit-patient-insurance-provider" type="text" placeholder="Enter insurance provider" formControlName="insuranceProvider" />
        </div>
      </div>
    </div>

    <!-- Submit -->

    <button type="submit" [disabled]="isSubmitting">@if(isSubmitting){ Updating... } @else { Update Patient }</button>
  </form>
</div>
