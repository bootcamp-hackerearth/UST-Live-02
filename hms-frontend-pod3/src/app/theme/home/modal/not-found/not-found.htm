<section class="notfound-wrapper">
  <div class="notfound-floating-orb orb-1"></div>
  <div class="notfound-floating-orb orb-2"></div>
  <div class="notfound-floating-orb orb-3"></div>

  <div class="notfound-card">
    <div class="notfound-icon-ring">
      <div class="notfound-icon-core">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>
    </div>

    <div class="notfound-badge">
      <span class="notfound-badge-dot"></span>
      ERROR 404
    </div>

    <div class="notfound-number">
      <span class="digit">4</span>
      <span class="digit zero">0</span>
      <span class="digit">4</span>
    </div>

    <h1 class="notfound-title">Page Not Found</h1>

    <p class="notfound-description">
      Oops! The page you're looking for seems to have wandered off into the void.
      It might have been moved, deleted, or perhaps it never existed at all.
    </p>

    <div class="notfound-divider">
      <span class="notfound-divider-line"></span>
      <span class="notfound-divider-text">What you can do</span>
      <span class="notfound-divider-line"></span>
    </div>

    <div class="notfound-actions">
      <button class="notfound-btn-secondary" onclick="history.back()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Go Back
      </button>
    </div>
  </div>
</section>
