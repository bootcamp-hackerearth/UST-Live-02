@if(toast(); as toast) {
<div class="global-toast" [ngClass]="toast.type">
  <span class="toast-icon">{{ toast.type === 'success' ? 'OK' : '!' }}</span>
  <span class="toast-message">{{ toast.message }}</span>
  <button class="toast-close" (click)="dismissToast()">x</button>
</div>
} @if(online() === false) {
<div class="offline-banner">You are offline. Saved pages remain visible, but new changes need a connection.</div>
}
<app-confirm-dialog></app-confirm-dialog>
<app-input-dialog></app-input-dialog>
<router-outlet></router-outlet>
