@if(dialog(); as dialog) {
<div class="input-backdrop" (click)="cancel()" (keydown.escape)="cancel()">
  <section class="input-card" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div>
      <h2>{{ dialog.title }}</h2>
      @if(dialog.message) {
      <p>{{ dialog.message }}</p>
      }
    </div>

    <label>
      <span>{{ dialog.inputLabel }}</span>
      <input
        [ngModel]="value()"
        (ngModelChange)="value.set($event)"
        [type]="dialog.inputType"
        [min]="dialog.min"
        autofocus
        (keyup.enter)="submit()"
      />
    </label>

    <div class="input-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">{{ dialog.cancelText }}</button>
      <button type="button" class="submit-btn" (click)="submit()">{{ dialog.confirmText }}</button>
    </div>
  </section>
</div>
}
