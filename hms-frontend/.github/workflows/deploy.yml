name: Deploy HMS FRONTEND

on:
  push:
    branches:
      - feature/sprint_5/arjun

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2 FRONTEND
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd hms-frontend-pod3
            git pull origin feature/sprint_5/arjun
            sudo npm ci
            ng build --configuration production
            rm -rf /var/www/hms-frontend/*
            cp -r dist/hms-frontend/browser/* /var/www/hms-frontend/
            sudo systemctl restart nginx